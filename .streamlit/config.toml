# MRARFAI v10 — Dark Theme (OLED)
# Fira Sans + Fira Code (ui-ux-pro-max skill)

[server]
address = "0.0.0.0"
headless = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 50
maxMessageSize = 200

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#FAFAFA"
backgroundColor = "#000000"
secondaryBackgroundColor = "#121212"
textColor = "#FAFAFA"
font = "sans serif"

[[theme.fontFaces]]
family = "Fira Sans"
url = "https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700&display=swap"

[[theme.fontFaces]]
family = "Fira Code"
url = "https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&display=swap"

[logger]
level = "warning"
